#
# Builds the swarm runner image from the repository root so that swarm-src/ and
# control-plane/ can be shared with the console image.
# Usage:
#   gcloud builds submit . --config=cloudbuild.backend.yaml \
#       --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/backend:latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
